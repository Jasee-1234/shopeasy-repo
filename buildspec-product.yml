version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo Installing dependencies...
      - pip install -r services/product/requirements.txt
      - pip install pytest

  pre_build:
    commands:
      - echo Running tests...
      - cd services/product && python -m pytest tests/ -v || true
      - cd $CODEBUILD_SRC_DIR
      - echo Logging in to ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      - echo Image tag is $IMAGE_TAG

  build:
    commands:
      - echo Building product image...
      - docker build -t $ECR_REPO_URL:$IMAGE_TAG -t $ECR_REPO_URL:latest -f services/product/Dockerfile services/product

  post_build:
    commands:
      - echo Pushing image...
      - docker push $ECR_REPO_URL:$IMAGE_TAG
      - docker push $ECR_REPO_URL:latest
      - printf '{"ImageURI":"%s"}' "$ECR_REPO_URL:$IMAGE_TAG" > imageDetail.json
      - sed -i "s|<EXECUTION_ROLE_ARN>|$EXECUTION_ROLE_ARN|g; s|<TASK_ROLE_ARN>|$TASK_ROLE_ARN|g; s|<AWS_REGION>|$AWS_DEFAULT_REGION|g" services/product/taskdef.json
      - cp services/product/taskdef.json .
      - cp services/product/appspec.yaml appspec.yml
      - echo Build completed
      - cat imageDetail.json

artifacts:
  files:
    - imageDetail.json
    - taskdef.json
    - appspec.yml
  discard-paths: yes